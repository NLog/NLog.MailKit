name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      force_nuget_publish:
        description: Force NuGet publish
        type: boolean
        default: false

env:
  SOLUTION: src/NLog.MailKit.sln
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            create_nuget_package: true
          - os: ubuntu-latest
            create_nuget_package: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Determine version suffix
        if: matrix.create_nuget_package
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF -eq "refs/heads/master") {
            echo "suffix=" >> $env:GITHUB_OUTPUT
          } else {
            # For a PR: use head_ref (actual branch name), otherwise the ref name
            $branchName = $env:HEAD_REF
            if ([string]::IsNullOrEmpty($branchName)) {
              $branchName = $env:REF_NAME
            }

            # Sanitize: non-alphanumeric -> '-', multiple '-' -> one, trim '-'
            $clean = $branchName -replace '[^a-zA-Z0-9]', '-' `
                                 -replace '-+', '-' `
                                 -replace '^-|-$', ''
            # Truncate to max 40 characters and remove trailing '-'
            $short = if ($clean.Length -gt 0) { $clean.Substring(0, [Math]::Min(40, $clean.Length)).TrimEnd('-') } else { "" }

            # PR number prefix
            $prPrefix = if ($env:PR_NUMBER) { "pr$($env:PR_NUMBER)-" } else { "" }

            $suffix = "${prPrefix}${short}.$($env:RUN_NUMBER)"
            echo "suffix=$suffix" >> $env:GITHUB_OUTPUT
          }

      - name: Pack
        if: matrix.create_nuget_package
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          if ($env:VERSION_SUFFIX) {
            dotnet pack $env:SOLUTION --no-build --configuration Release --output artifacts --version-suffix "$env:VERSION_SUFFIX"
          } else {
            dotnet pack $env:SOLUTION --no-build --configuration Release --output artifacts
          }

      - name: Upload nuget package
        if: matrix.create_nuget_package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*pkg

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_nuget_publish)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download nuget package
        uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts\*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
